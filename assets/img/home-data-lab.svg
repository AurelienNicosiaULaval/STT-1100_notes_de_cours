<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" role="img" aria-labelledby="title desc">
  <title id="title">Nuage de points avec tendance et densités marginales</title>
  <desc id="desc">Une composition statistique montre des observations, une tendance ajustée et deux distributions marginales.</desc>
  <defs>
    <linearGradient id="trend-band" x1="0" x2="1" y1="1" y2="0">
      <stop offset="0" stop-color="#14b8a6" stop-opacity=".12"/>
      <stop offset=".55" stop-color="#14b8a6" stop-opacity=".24"/>
      <stop offset="1" stop-color="#ffc103" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="density-fill" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#14b8a6" stop-opacity=".34"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="plot-clip">
      <rect x="88" y="108" width="500" height="330"/>
    </clipPath>
    <filter id="point-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .grid-line { stroke: #94a3b8; stroke-opacity: .42; stroke-width: 1; stroke-dasharray: 4 6; }
    .axis-line { stroke: #0f2742; stroke-opacity: .9; stroke-width: 1.5; }
    .zero-line { stroke: #475569; stroke-opacity: .62; stroke-width: 1.2; stroke-dasharray: 5 5; }
    .axis-label { fill: #0f2742; font: 18px Helvetica, Arial, sans-serif; }
    .math-label { fill: #0f2742; font: italic 20px Georgia, serif; }
    .data-point { fill: #14b8a6; opacity: 0; transform-box: fill-box; transform-origin: center; animation: point-in .55s cubic-bezier(.2,.8,.2,1) var(--point-delay) forwards; }
    .data-point--gold { fill: #ffc103; filter: url(#point-glow); }
    .rug-mark { stroke: #14b8a6; stroke-width: 2; stroke-linecap: round; opacity: .8; }
    .trend-band { fill: url(#trend-band); opacity: 0; animation: band-in .8s ease .35s forwards; }
    .trend-line { fill: none; stroke: #0f2742; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 590; stroke-dashoffset: 590; animation: draw-line 1.35s cubic-bezier(.4,0,.2,1) .35s forwards; }
    .density-area { fill: url(#density-fill); }
    .density-line { fill: none; stroke: #14b8a6; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .residual { stroke: #0f2742; stroke-opacity: .64; stroke-width: 1.4; stroke-dasharray: 3 4; }
    @keyframes point-in { from { opacity: 0; transform: scale(.15); } to { opacity: .9; transform: scale(1); } }
    @keyframes draw-line { to { stroke-dashoffset: 0; } }
    @keyframes band-in { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .data-point, .trend-band, .trend-line { animation: none; opacity: .9; stroke-dashoffset: 0; }
    }
  </style>

