<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Collaborer avec GitHub | STT-1100</title>
<link rel="icon" href="data:,">
<style>
:root{color-scheme:light;font-family:Arial,"Helvetica Neue",sans-serif;color:#173449;background:#fff}
*{box-sizing:border-box}
body{margin:0}
main{max-width:1600px;margin:auto;padding:16px 20px 22px}
nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:0 auto 12px}
button{font:inherit;font-size:17px;line-height:1.3;padding:10px 16px;border:1px solid #c6d1d9;border-radius:8px;background:#fff;color:#173449;cursor:pointer}
button:hover{background:#eef3f6}
button[aria-pressed=true]{background:#173449;border-color:#173449;color:#fff}
button:focus-visible{outline:3px solid #a15a16;outline-offset:3px}
.stage{overflow-x:auto}
.diagram{display:block;width:100%;height:auto;min-width:900px}
.utility{display:flex;justify-content:center;gap:10px;margin-top:10px}
.utility button{font-size:16px}
:fullscreen main{max-width:1920px;height:100vh;display:flex;flex-direction:column;justify-content:center;padding:12px 20px}
:fullscreen .stage{min-height:0}
:fullscreen .diagram{max-height:calc(100vh - 128px);width:100%;min-width:0}
@media print{nav,.utility{display:none}main{padding:0;max-width:none}.diagram{min-width:0}@page{size:landscape;margin:5mm}}
</style>
</head>
<body>
<main>
<nav aria-label="Étapes de la collaboration">
<button data-step="0" aria-pressed="true">Vue d’ensemble</button>
<button data-step="1" aria-pressed="false">1 · Branche</button>
<button data-step="2" aria-pressed="false">2 · Commit</button>
<button data-step="3" aria-pressed="false">3 · Push</button>
<button data-step="4" aria-pressed="false">4 · PR</button>
<button data-step="5" aria-pressed="false">5 · Fusion</button>
<button data-step="6" aria-pressed="false">Conflit</button>
<button data-step="7" aria-pressed="false">Issue</button>
</nav>
<div class="stage">
<svg id="diagram" class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Une contribution, trois personnes</title>
<desc id="diagram-desc">Sur son ordinateur, Alice crée une branche et deux commits. Elle pousse ses commits sur GitHub. Camille relit la pull request. Benoît fusionne la contribution dans main. Un conflit appelle une décision sur des changements incompatibles. Une issue sert à discuter et suivre un point précis.</desc>
<defs>
<marker id="arrow-blue" markerWidth="19" markerHeight="18" refX="17" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L17 9L1 17" fill="none" stroke="#176b9b" stroke-width="3"/></marker>
<marker id="arrow-main" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 5L0 10" fill="none" stroke="#18785b" stroke-width="2.5"/></marker>
<marker id="arrow-neutral" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 5L0 10" fill="none" stroke="#667b89" stroke-width="2.5"/></marker>
<style>
text{font-family:Arial,"Helvetica Neue",sans-serif;fill:#173449;font-weight:400}
.heading{font-size:49px;font-weight:500}
.zone-title{font-size:34px;font-weight:500}
.label{font-size:32px;font-weight:500}
.detail{font-size:27px}
.commit-id{font-size:26px;text-anchor:middle;dominant-baseline:central}
.person{font-size:26px;text-anchor:middle;dominant-baseline:central}
.ink-blue{fill:#176b9b}.ink-green{fill:#18785b}.ink-orange{fill:#965612}.ink-red{fill:#ac352f}.ink-purple{fill:#665096}
.main-line{stroke:#18785b;stroke-width:7;fill:none;stroke-linecap:round}
.branch-line{stroke:#176b9b;stroke-width:6;fill:none;stroke-linecap:round}
.neutral-line{stroke:#667b89;stroke-width:3;fill:none}
.commit{fill:#fff;stroke:#176b9b;stroke-width:5}
.hidden{display:none}
.caption{font-size:33px}
</style>
</defs>
<rect width="1600" height="900" fill="#fff"/>
<text id="scene-heading" x="68" y="93" class="heading">Une contribution, trois personnes</text>
<g id="normal-scene">
<rect x="60" y="165" width="600" height="525" rx="18" fill="#f1f6f9"/>
<rect x="700" y="165" width="840" height="525" rx="18" fill="#f7f9fa"/>
<text x="98" y="230" class="zone-title">Ordinateur d’Alice</text>
<text x="740" y="230" class="zone-title">GitHub · dépôt partagé</text>
<text x="98" y="341" class="label ink-green">main</text>
<path d="M105 365H610" class="main-line"/>
<circle cx="215" cy="365" r="12" fill="#18785b"/>
<text x="740" y="341" class="label ink-green">main</text>
<path d="M750 365H1498" class="main-line" marker-end="url(#arrow-main)"/>
<circle cx="850" cy="365" r="12" fill="#18785b"/>
<g id="branch-local">
<path d="M215 365C215 455 250 555 320 555H585" class="branch-line"/>
<text x="286" y="466" class="label ink-blue">Branche</text>
<text x="286" y="503" class="detail">d’Alice</text>
</g>
<g id="commits-local">
<circle cx="390" cy="555" r="24" class="commit"/>
<text x="390" y="555" class="commit-id">1</text>
<circle cx="525" cy="555" r="24" class="commit"/>
<text x="525" y="555" class="commit-id">2</text>
<text x="410" y="622" class="label">Commit</text>
</g>
<g id="push-group">
<path d="M594 555H940" stroke="#176b9b" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#arrow-blue)"/>
<rect x="690" y="475" width="125" height="48" rx="9" fill="#fff"/>
<text x="752" y="510" text-anchor="middle" class="label ink-blue">Push</text>
</g>
<g id="branch-remote">
<path d="M850 365C850 455 880 555 955 555H1180" class="branch-line"/>
<circle cx="1010" cy="555" r="24" class="commit"/>
<text x="1010" y="555" class="commit-id">1</text>
<circle cx="1130" cy="555" r="24" class="commit"/>
<text x="1130" y="555" class="commit-id">2</text>
</g>
<g id="pr-group">
<path id="pr-curve" d="M1180 555C1295 555 1280 365 1400 365" stroke="#a25d14" stroke-width="4" stroke-dasharray="9 8" fill="none"/>
<circle cx="1193" cy="618" r="25" fill="#fff0dc"/>
<text x="1193" y="618" class="person ink-orange">C</text>
<text x="1238" y="611" class="label ink-orange">PR</text>
<text x="1238" y="650" class="detail">Camille relit</text>
</g>
<g id="merge-group">
<path d="M1180 555C1295 555 1280 365 1400 365" class="branch-line"/>
<circle cx="1400" cy="365" r="23" fill="#fff" stroke="#18785b" stroke-width="6"/>
<circle cx="1400" cy="281" r="24" fill="#e0f1e8"/>
<text x="1400" y="281" class="person ink-green">B</text>
<text x="1400" y="327" text-anchor="middle" class="label ink-green">Fusion</text>
<text x="1400" y="421" text-anchor="middle" class="detail">Benoît</text>
</g>
<g id="overview-extras">
<rect x="60" y="728" width="715" height="120" rx="14" fill="#fff1ee"/>
<text x="90" y="775" class="label ink-red">Conflit</text>
<text x="90" y="817" class="detail">Des changements incompatibles</text>
<rect x="805" y="728" width="735" height="120" rx="14" fill="#f1eef8"/>
<text x="835" y="775" class="label ink-purple">Issue</text>
<text x="835" y="817" class="detail">Un point à discuter ou à corriger</text>
</g>
</g>
<g id="conflict-scene" class="hidden">
<rect x="530" y="180" width="540" height="112" rx="15" fill="#eef3f6"/>
<text x="800" y="227" text-anchor="middle" class="detail">Au départ, le titre du graphique est</text>
<text x="800" y="269" text-anchor="middle" class="label">« Retards »</text>
<path d="M800 292V330M800 330H410V399M800 330H1190V399" class="neutral-line"/>
<rect x="120" y="405" width="580" height="188" rx="16" fill="#eef5fa"/>
<text x="155" y="458" class="label ink-blue">Branche d’Alice</text>
<text x="155" y="519" class="label">« Retards par transporteur »</text>
<rect x="900" y="405" width="580" height="188" rx="16" fill="#eaf4ef"/>
<text x="935" y="458" class="label ink-green">main a changé</text>
<text x="935" y="519" class="label">« Retards au départ de JFK »</text>
<path d="M410 593V648H700M1190 593V648H900" class="neutral-line"/>
<rect x="600" y="615" width="400" height="78" rx="12" fill="#fff0ec"/>
<text x="800" y="666" text-anchor="middle" class="label ink-red">Git attend un choix</text>
</g>
<g id="issue-scene" class="hidden">
<circle cx="235" cy="367" r="47" fill="#eee8f7"/>
<text x="235" y="368" class="person ink-purple" style="font-size:38px">C</text>
<text x="235" y="456" text-anchor="middle" class="label">Camille</text>
<path d="M306 367H444" class="neutral-line" marker-end="url(#arrow-neutral)"/>
<rect x="470" y="245" width="990" height="300" rx="20" fill="#f1eef8"/>
<text x="515" y="307" class="label ink-purple">Issue #1</text>
<text x="515" y="385" class="zone-title">Ajouter l’unité au graphique 2</text>
<text x="515" y="468" class="detail">On discute, on précise, on suit la correction.</text>
</g>
<text id="scene-caption" x="800" y="798" text-anchor="middle" class="caption hidden"></text>
</svg>
</div>
<div class="utility">
<button id="previous" aria-label="Étape précédente">← Précédent</button>
<button id="next" aria-label="Étape suivante">Suivant →</button>
<button id="fullscreen">Plein écran</button>
</div>
</main>
<script>
(() => {
  const diagram = document.getElementById('diagram');
  const buttons = Array.from(document.querySelectorAll('button[data-step]'));
  const scenes = [
    {title:'Une contribution, trois personnes', caption:'', description:'Alice crée une branche et deux commits sur son ordinateur. Push envoie ses commits sur GitHub. Camille relit sa pull request et Benoît fusionne la contribution dans main. Un conflit exige un choix sur des changements incompatibles. Une issue permet de discuter et suivre un point précis.'},
    {title:'1 · Créer une branche', caption:'Alice crée une branche pour sa contribution.', description:'La branche d’Alice part de main dans sa copie locale du projet.'},
    {title:'2 · Enregistrer des commits', caption:'Un commit enregistre une étape dans l’historique local.', description:'Alice fait deux commits dans sa branche. Ces étapes sont encore sur son ordinateur.'},
    {title:'3 · Envoyer avec Push', caption:'Push envoie les commits sur GitHub.', description:'Les mêmes commits 1 et 2 deviennent disponibles dans la branche d’Alice sur le dépôt GitHub partagé.'},
    {title:'4 · Proposer une pull request', caption:'La PR propose la modification et permet à Camille de la relire.', description:'La pull request compare la branche d’Alice à main. Camille peut examiner les changements et demander une correction avant la fusion.'},
    {title:'5 · Fusionner dans main', caption:'La fusion intègre la branche d’Alice dans main.', description:'Après la relecture, Benoît fusionne la pull request. La contribution d’Alice est intégrée à main sur GitHub.'},
    {title:'Conflit · Choisir ensemble', caption:'L’équipe choisit le contenu final avant la fusion.', description:'Deux changements différents touchent la même ligne de titre à partir du texte Retards. Alice a écrit Retards par transporteur. Le titre sur main est devenu Retards au départ de JFK. Git attend une résolution du conflit.'},
    {title:'Issue · Ouvrir la discussion', caption:'Une issue peut lancer une nouvelle contribution.', description:'Camille ouvre une issue pour demander une unité sur le graphique 2. Cette discussion permet de préciser et suivre la correction.'}
  ];
  let current = 0;
  function visible(id, show) { document.getElementById(id).classList.toggle('hidden', !show); }
  function select(step) {
    current = Math.max(0, Math.min(scenes.length - 1, Number(step)));
    const overview = current === 0;
    const ordinary = current <= 5;
    visible('normal-scene', ordinary);
    visible('branch-local', ordinary);
    visible('commits-local', overview || (current >= 2 && ordinary));
    visible('push-group', overview || (current >= 3 && ordinary));
    visible('branch-remote', overview || (current >= 3 && ordinary));
    visible('pr-group', overview || (current >= 4 && ordinary));
    visible('pr-curve', current === 4);
    visible('merge-group', overview || current === 5);
    visible('overview-extras', overview);
    visible('conflict-scene', current === 6);
    visible('issue-scene', current === 7);
    visible('scene-caption', !overview);
    document.getElementById('scene-heading').textContent = scenes[current].title;
    document.getElementById('diagram-title').textContent = scenes[current].title;
    document.getElementById('diagram-desc').textContent = scenes[current].description;
    document.getElementById('scene-caption').textContent = scenes[current].caption;
    buttons.forEach(button => button.setAttribute('aria-pressed', Number(button.dataset.step) === current ? 'true' : 'false'));
    document.getElementById('previous').disabled = current === 0;
    document.getElementById('next').disabled = current === scenes.length - 1;
  }
  buttons.forEach(button => button.addEventListener('click', () => select(button.dataset.step)));
  document.getElementById('previous').addEventListener('click', () => select(current - 1));
  document.getElementById('next').addEventListener('click', () => select(current + 1));
  document.addEventListener('keydown', event => {
    if (event.altKey || event.ctrlKey || event.metaKey) return;
    if (event.key === 'ArrowRight') { event.preventDefault(); select(current + 1); }
    if (event.key === 'ArrowLeft') { event.preventDefault(); select(current - 1); }
    if (event.key === 'Home') { event.preventDefault(); select(0); }
  });
  document.getElementById('fullscreen').addEventListener('click', async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    } catch (error) {
      document.getElementById('fullscreen').textContent = 'Utiliser le plein écran du navigateur';
    }
  });
  select(0);
})();
</script>
</body>
</html>
