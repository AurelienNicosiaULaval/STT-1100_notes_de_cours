project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "module_*/**/*.qmd"
    - "projet_session/**/*.qmd"
    - "autre_materiel/**/*.qmd"
    - "!anciens_examens/**/*.qmd"
    - "!en/**"
  resources:
    - "module_*/**/*.csv"
    - "module_*/**/*.json"
    - "module_*/**/*.xlsx"
    - "module_*/**/*.rds"
    - "autre_materiel/**/*.pdf"
    - "anciens_examens/**/*.pdf"
    - "anciens_examens/**/*.csv"

lang: fr

website:
  title: "STT-1100 Introduction à la science des données"
  description: "Portail de cours bilingue pour STT-1100, avec notes, modules, projet de session, ressources et outils de travail en science des données."
  llms-txt: true
  search: true
  navbar:
    left:
      - text: "Accueil"
        href: index.qmd
      - text: "Démarrage"
        href: demarrage.qmd
      - text: "Modules"
        menu:
          - text: "Vue d'ensemble"
            href: modules.qmd
          - text: "Module 01 - Plongée en science des données"
            href: module_01/index.qmd
          - text: "Module 02 - GitHub et visualisation de données"
            href: module_02/index.qmd
          - text: "Module 03 - Les catégories sous toutes leurs formes"
            href: module_03/index.qmd
          - text: "Module 04 - Facteurs et nettoyage de données"
            href: module_04/index.qmd
          - text: "Module 05 - Explorer et comprendre les relations entre les variables"
            href: module_05/index.qmd
          - text: "Module 06 - Collaboration et reproductibilité dans GitHub"
            href: module_06/index.qmd
          - text: "Module 07 - Visualisation, éthique et sécurisation des données"
            href: module_07/index.qmd
          - text: "Module 08 - Automatisation et exploration du web"
            href: module_08/index.qmd
          - text: "Module 09 - Prédiction et biais"
            href: module_09/index.qmd
          - text: "Module 10 - Au-delà des données: texte et tableau de bord"
            href: module_10/index.qmd
      - text: "Évaluations"
        menu:
          - text: "Vue d'ensemble"
            href: evaluations.qmd
          - text: "Examen"
            href: examen.qmd
          - text: "Défis"
            href: defis.qmd
          - text: "Projet de session"
            href: projet_session/index.qmd
      - text: "Ressources"
        href: ressources.qmd
    right:
      - text: "Glossaire"
        href: glossaire.qmd

format:
  html:
    css: css/base_css.css
    include-after-body: language-switch.html
    grid:
      body-width: 1120px
      margin-width: 220px
      sidebar-width: 260px
      gutter-width: 1.5rem
